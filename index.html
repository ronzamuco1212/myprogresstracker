<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Progress</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#0F172A;--sf:#1E293B;--sf2:#263449;--bd:#334155;--tx:#F8FAFC;--mt:#94A3B8;--p:#7C3AED;--p2:#8B5CF6;--pl:rgba(124,58,237,.15);--o:#F97316;--o2:#FB923C;--ol:rgba(249,115,22,.15);--t:#14B8A6;--t2:#2DD4BF;--r:#9F3A2E;--r2:#B84A3A;--d:#EF4444;--g:#FBBF24;--sh:0 8px 25px rgba(0,0,0,.25)}
body.light{--bg:#F1F5F9;--sf:#FFF;--sf2:#F1F5F9;--bd:#CBD5E1;--tx:#0F172A;--mt:#64748B;--pl:rgba(124,58,237,.1);--ol:rgba(234,88,12,.1);--sh:0 4px 15px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s;overflow-x:hidden;overscroll-behavior:none}
body{padding:14px;padding-bottom:120px;position:relative}
button,input{font:inherit}
button{cursor:pointer;font-family:inherit}
.app{width:100%;max-width:600px;margin:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ta h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.5px}
.ta p{margin:4px 0 0;color:var(--mt);font-size:12px}
.ha{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border:1px solid var(--bd);background:var(--sf);border-radius:12px;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;transition:.2s;color:var(--tx)}
.ib:active{transform:scale(.9)}
.uc{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc .dot{width:8px;height:8px;border-radius:50%;background:var(--t2);box-shadow:0 0 8px var(--t2);flex-shrink:0}
.uc.hidden,.lo.hidden,.ls.hidden{display:none}
.lo{border:1px solid var(--d);background:transparent;color:var(--d);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:700}
.ls{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:100%;max-width:400px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:28px 24px;box-shadow:var(--sh);text-align:center}
.li{font-size:48px;margin-bottom:8px}
.lt{font-size:22px;font-weight:800;margin:0 0 6px}
.ld{color:var(--mt);font-size:13px;margin:0 0 20px;line-height:1.5}
.lin{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;outline:none;margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:2px;font-weight:700;font-size:15px}
.lin::placeholder{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.lin:focus{border-color:var(--p2)}
.lbtn{width:100%;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14px;margin-bottom:8px}
.lbtn.pri{background:var(--p);color:#fff}
.lbtn.sec{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.lbtn:active{transform:scale(.98)}
.ltabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sf2);border-radius:12px;padding:4px;margin-bottom:16px}
.ltab{border:none;background:transparent;color:var(--mt);padding:10px;border-radius:9px;font-weight:800;font-size:13px}
.ltab.act{background:var(--p);color:#fff}
.le{color:var(--d);font-size:12px;margin-top:10px;min-height:16px}
.ln{color:var(--mt);font-size:11px;margin-top:14px;line-height:1.5}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.sc::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-30px;top:-30px;opacity:.12}
.sc.cal::after{background:var(--o)}
.sc.walk::after{background:var(--t)}
.sl{color:var(--mt);font-size:12px;font-weight:600}
.sn{font-size:28px;line-height:1;font-weight:900;margin-top:7px}
.sc.cal .sn{color:var(--o2)}
.sc.walk .sn{color:var(--t2)}
.sb{margin-top:6px;font-size:11px;color:var(--mt)}
.rw{position:absolute;right:10px;bottom:10px;width:42px;height:42px;opacity:.85}
.rs{transform:rotate(-90deg);width:100%;height:100%}
.rb{fill:none;stroke:var(--bd);stroke-width:3}
.rf{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.rcal .rf{stroke:var(--o2)}
.rwalk .rf{stroke:var(--t2)}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mt2{text-align:center;flex:1}
.mt2 strong{display:block;font-size:18px;font-weight:800}
.mt2 span{font-size:11px;color:var(--mt)}
.mbtn{width:38px;height:38px;border:none;border-radius:12px;background:var(--sf2);color:var(--tx);font-size:21px;font-weight:700}
.mbtn:active{transform:scale(.94);background:var(--p);color:#fff}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.wk{text-align:center;color:var(--mt);font-size:10px;font-weight:800;padding:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:pan-y}
.dy{position:relative;min-width:0;aspect-ratio:1/1.08;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:.15s;cursor:pointer}
.dy:active{transform:scale(.94)}
.dy.empty{background:transparent;border-color:transparent;pointer-events:none}
.dn{font-size:14px;font-weight:800;z-index:2}
.dy.today{border:2px solid var(--p2)}
.dy.sel{background:var(--p);border-color:var(--p2);box-shadow:0 0 0 2px var(--pl)}
.dy.both{border-color:var(--g);box-shadow:0 0 0 2px rgba(251,191,36,.2)}
.dy.both::before{content:"⭐";position:absolute;top:2px;right:3px;font-size:9px;z-index:3;animation:st 1.5s ease-in-out infinite}
@keyframes st{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:1}}
.tl{position:absolute;top:3px;font-size:7px;color:#DDD6FE;font-weight:800}
.mk{display:flex;gap:3px;margin-top:4px;z-index:2}
.mr{width:7px;height:7px;border-radius:50%}
.mr.cal{background:var(--o2);box-shadow:0 0 6px rgba(251,146,60,.4)}
.mr.walk{background:var(--t2);box-shadow:0 0 6px rgba(45,212,191,.4)}
.hb{text-align:center;color:var(--mt);font-size:11px;margin-top:12px;padding:12px;background:var(--sf);border:1px dashed var(--bd);border-radius:14px;line-height:1.5}
.hb b{color:var(--p2)}
.vw{display:none}
.vw.act{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wr{text-align:center;flex:1;font-size:14px;font-weight:800;color:var(--tx)}
.wr span{display:block;font-size:11px;color:var(--mt);font-weight:600;margin-top:2px}
.jb{width:38px;height:38px;border:none;border-radius:12px;background:var(--p);color:#fff;font-size:14px;font-weight:800;padding:0}
.jb:active{transform:scale(.94)}
.hc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ht{display:flex;align-items:center;gap:10px}
.hi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.hi.cal{background:var(--ol);border:1px solid rgba(249,115,22,.35)}
.hi.walk{background:rgba(20,184,166,.15);border:1px solid rgba(20,184,166,.35)}
.hn{font-size:15px;font-weight:800}
.hs{font-size:11px;color:var(--o2);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:4px}
.hs.fire .fe{animation:fp 1.5s ease-in-out infinite}
.hc2{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;flex-shrink:0}
.hc2.cal{background:var(--p)}
.hc2.walk{background:var(--r)}
.hc2.empty{background:var(--sf2);border:1px solid var(--bd)}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcw{display:flex;flex-direction:column;align-items:center;gap:5px}
.dcl{font-size:10px;color:var(--mt);font-weight:700}
.dc{width:100%;aspect-ratio:1/1;max-width:42px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--mt);transition:.2s;cursor:pointer}
.dc:active{transform:scale(.9)}
.dc.dn2.cal{background:var(--p);border-color:var(--p2);color:#fff}
.dc.dn2.walk{background:var(--r);border-color:var(--r2);color:#fff}
.dc.today{box-shadow:0 0 0 3px var(--pl)}
.dc.fut{opacity:.35}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.mdc{aspect-ratio:1/1;border-radius:6px;background:var(--sf2);border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mt);font-weight:700;cursor:pointer}
.mdc:active{transform:scale(.9)}
.mdc.dn2.cal{background:var(--pl);border-color:var(--p2);color:var(--p2)}
.mdc.dn2.walk{background:rgba(159,58,46,.2);border-color:var(--r2);color:var(--r2)}
.mdc.empty{opacity:0;pointer-events:none}
.oc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.ot{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.sr:last-child{border-bottom:none}
.slb{color:var(--mt)}
.sv{font-weight:800;color:var(--tx)}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.ac{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;position:relative;transition:.2s}
.ac.lock{opacity:.4;filter:grayscale(1)}
.ac.unl{border-color:var(--g);background:rgba(251,191,36,.1)}
.ac.unl::after{content:"✨";position:absolute;top:-4px;right:-4px;font-size:12px;animation:st 2s ease-in-out infinite}
.ai{font-size:24px}
.an{font-size:9px;color:var(--mt);font-weight:700;margin-top:4px;line-height:1.2}
.bn{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:99999;pointer-events:auto;box-shadow:0 -6px 25px rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ni{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--sf2);border-radius:18px;padding:5px;pointer-events:auto}
.nb{border:none;background:transparent;color:var(--mt);padding:12px 4px 10px;border-radius:14px;font-size:10px;font-weight:800;cursor:pointer;transition:.2s;pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;-webkit-tap-highlight-color:rgba(124,58,237,.3);touch-action
